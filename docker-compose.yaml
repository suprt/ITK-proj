services:
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: trading-user-service
    ports:
      - "50051:50051"
    env_file:
      - user-service/.env
    environment:
      POSTGRES_DSN: "postgres://trading:trading@postgres-user:5432/user_db?sslmode=disable"
    depends_on:
      postgres-user:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8.10.2-alpine
    command: >
      redis-server
      --user default off
      --user ${REDIS_USER:-redis_user} on ">${REDIS_PASSWORD:-redis_password}" "~*" "+@all"
    container_name: trading-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-user:
    image: postgres:16-alpine
    container_name: trading-postgres-user
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports:
      - "5432:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  postgres-spot:
    image: postgres:16-alpine
    container_name: trading-postgres-spot
    environment:
      POSTGRES_DB: spot_db
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports:
      - "5433:5432"
    volumes:
      - postgres_spot_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U trading -d spot_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
  postgres-order:
    image: postgres:16-alpine
    container_name: trading-postgres-order
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports:
      - "5434:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U trading -d order_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_user_data:
  postgres_spot_data:
  postgres_order_data:
  redis_data:
