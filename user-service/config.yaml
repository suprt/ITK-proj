auth:
  whitelist:
    /user.v1.UserService/Register: {}
    /user.v1.UserService/Login: {}
    /user.v1.UserService/RefreshToken: {}
    /user.v1.UserService/GetPublicProfile: {}

seed:
  enabled: true
  users:
    - email: admin@local
      username: admin
      password: admin12345
      roles: [ USER, ADMIN ]
    - email: trader@local
      username: trader
      password: trader12345
      roles: [ USER, TRADER ]
    - email: user@local
      username: user
      password: user12345
      roles: [ USER ]

rate_limiter:
  default:
    limit: 100
    window: 1m
  methods:
    "/user.v1.UserService/Login":
      limit: 10
      window: 1m
    "/user.v1.UserService/Register":
      limit: 5
      window: 1m
    "/user.v1.UserService/RefreshToken":
      limit: 20
      window: 1m