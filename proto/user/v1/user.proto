syntax = "proto3";

package user.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/descriptor.proto";

option go_package = "github.com/suprt/trading/proto/user/v1;user_v1";

extend google.protobuf.MethodOptions{
  bool requires_auth = 50001;
}


enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_TRADER = 2;
  ROLE_ADMIN = 3;
}

service UserService {
  rpc Register(RegisterRequest) returns (RegisterResponse){
    option (requires_auth) = false;
  };
  rpc Login(LoginRequest) returns (LoginResponse){
    option (requires_auth) = false;
  };
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse){
    option (requires_auth) = false;
  };
  rpc GetSelfProfile(GetSelfProfileRequest) returns (GetSelfProfileResponse);
  rpc GetUserByID(GetUserByIDRequest) returns (GetUserByIDResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse){
    option (requires_auth) = false;
  };
  rpc AddRole(AddRoleRequest) returns (AddRoleResponse);
  rpc RemoveRole(RemoveRoleRequest) returns (RemoveRoleResponse);
}

message User {
  string id = 1;
  string email = 2;
  repeated Role roles = 3;
  int64 roles_version = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message RegisterRequest {
  string email = 1 [
    (buf.validate.field).string.email = true,
    (buf.validate.field).string.min_len = 1
  ];
  string password = 2 [(buf.validate.field).string.min_len = 8];
}

message RegisterResponse {
  string user_id = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message LoginRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string.min_len = 1];
}

message LoginResponse {
  string user_id = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

//публичный метод, user_id из токена
message GetSelfProfileRequest {}

message GetSelfProfileResponse {
  User user = 1;
}

message GetUserByIDRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetUserByIDResponse {
  User user = 1;
}

message LogoutRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message LogoutResponse {}

message AddRoleRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  Role role = 2 [(buf.validate.field).enum.defined_only = true];
}

message AddRoleResponse {}

message RemoveRoleRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  Role role = 2 [(buf.validate.field).enum.defined_only = true];
}
message RemoveRoleResponse {}
