syntax = "proto3";

package user.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/suprt/trading/proto/user/v1;user_v1";



enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_TRADER = 2;
  ROLE_ADMIN = 3;
}

service UserService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc GetSelfProfile(GetSelfProfileRequest) returns (GetSelfProfileResponse);
  rpc GetUserByID(GetUserByIDRequest) returns (GetUserByIDResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc AddRole(AddRoleRequest) returns (AddRoleResponse);
  rpc RemoveRole(RemoveRoleRequest) returns (RemoveRoleResponse);
  rpc GetPublicProfile(GetPublicProfileRequest) returns (GetPublicProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
}

message User {
  string id = 1;
  string email = 2;
  string username= 3;
  repeated Role roles = 4;
  int64 roles_version = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message PublicProfile {
  string id =1;
  string username = 2;
  google.protobuf.Timestamp created_at = 3;
}

message RegisterRequest {
  string email = 1 [
    (buf.validate.field).string.email = true,
    (buf.validate.field).string.min_len = 1
  ];
  string password = 2 [(buf.validate.field).string.min_len = 8];
  string username = 3 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 30,
    (buf.validate.field).string.pattern = "^[a-zA-Z0-9_]+$"
  ];
}

message RegisterResponse {
  string user_id = 1;
}

message LoginRequest {
  string email = 1 [
    (buf.validate.field).string.email = true,
    (buf.validate.field).string.min_len = 1
  ];
  string password = 2 [(buf.validate.field).string.min_len = 8];
}

message LoginResponse {
  string user_id = 1;
  string access_token = 2;
  string refresh_token = 3;
  int64 access_expires_in = 4; //seconds
}

message RefreshTokenRequest {
  string refresh_token = 1 [(buf.validate.field).string.len = 43];
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_expires_in = 3; //seconds
}


message GetSelfProfileRequest {}

message GetSelfProfileResponse {
  User user = 1;
}

message GetUserByIDRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetUserByIDResponse {
  User user = 1;
}

message LogoutRequest {
  string refresh_token = 1 [(buf.validate.field).string.len = 43];
}

message LogoutResponse {}

message AddRoleRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  Role role = 2 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in=0
  ];
}

message AddRoleResponse {}

message RemoveRoleRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  Role role = 2 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in=0
  ];
}
message RemoveRoleResponse {}

message GetPublicProfileRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetPublicProfileResponse {
  PublicProfile profile = 1;
}

message UpdateProfileRequest{
  optional string email = 1 [
    (buf.validate.field).string.email = true
  ];
  optional string username = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len=30,
    (buf.validate.field).string.pattern = "^[a-zA-Z0-9_]+$"
  ];
}

message UpdateProfileResponse{}

message ChangePasswordRequest{
  string current_password = 1 [(buf.validate.field).string.min_len = 1];
  string new_password = 2 [(buf.validate.field).string.min_len = 8];
}

message ChangePasswordResponse{}